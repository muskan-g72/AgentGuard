app = "agentguard-test-only"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  AGENTGUARD_DEPLOYMENT_MODE = "durable"
  AGENTGUARD_PUBLIC_ORIGIN = "https://demo-booking-tau.vercel.app"
  AGENTGUARD_BACKEND_HOST = "agentguard-test-only.fly.dev"
  AGENTGUARD_DB = "/data/workflow.db"
  AGENTGUARD_VOLUME_PATH = "/data"
  AGENTGUARD_ENABLE_AGENT_RUNS = "false"

[deploy]
  strategy = "immediate"

[[mounts]]
  source = "agentguard_data"
  destination = "/data"
  snapshot_retention = 7

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/health"
  [http_service.checks.headers]
    Host = "agentguard-test-only.fly.dev"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
