[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guard"
version = "0.1.0"
description = "Pure cart authorization checks for AgentGuard"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.11,<3",
    "python-dotenv>=1,<2",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]
browser = ["playwright>=1.50,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: real local Chromium and HTTP server, no paid services"]

[tool.setuptools.packages.find]
include = ["guard*", "app*"]
