<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Booking confirmation · AgentGuard Demo</title><link rel="stylesheet" href="styles.css"></head>
<body><main><header><a class="muted" href="ui/">← AgentGuard control room</a><h1 id="heading">Booking confirmation</h1></header>
<p class="banner">SIMULATED ORDER — no payment taken</p><section class="card" id="order"></section>
<a class="button" href="index.html">Start another booking</a></main><script>
'use strict';
const target = document.getElementById('order');
try {
  const value = JSON.parse(sessionStorage.getItem('agentguard:last-order'));
  const expected = new URLSearchParams(location.search).get('order_id');
  if (!value || value.order_id !== expected || !Number.isSafeInteger(value.total) || !Array.isArray(value.items)) throw new Error();
  document.getElementById('heading').textContent = 'Booking confirmed';
  for (const [label, text] of [['Order ID', value.order_id], ['Total charged (simulated)', 'Rs ' + value.total.toLocaleString('en-IN')]]) {
    const row = document.createElement('p'); const strong = document.createElement('strong'); strong.textContent = label + ': ';
    row.append(strong, document.createTextNode(text)); target.append(row);
  }
  for (const item of value.items) {
    const row = document.createElement('p'); row.textContent = `${item.id}: Rs ${item.price.toLocaleString('en-IN')}`; target.append(row);
  }
} catch {
  target.textContent = 'No confirmed order was found in this browser. Return to the booking page to place a simulated order.';
}
</script></body></html>
