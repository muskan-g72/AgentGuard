<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgentGuard Demo Booking</title><link rel="stylesheet" href="styles.css"><script src="app.js"></script></head>
<body><main><header><a class="muted" href="ui/">← AgentGuard control room</a><h1>Demo train booking</h1><p class="muted">All bookings are simulated. No payment is taken.</p><label for="scenario-select">Demo scenario</label><select id="scenario-select" style="font:inherit;padding:12px;width:100%;margin-top:10px;border:1px solid #aeb9c5;border-radius:6px"></select></header>
<section class="card"><form id="search"><div class="search-grid"><label>From<input type="text" value="Ludhiana" readonly></label><label>To<input type="text" value="Delhi" readonly></label><label>Date<input type="date" value="2026-10-26" readonly></label><label>Passengers<input type="number" value="1" readonly></label></div></form></section>
<section id="results" aria-label="Train results"></section></main>
<script>
const {scenario, tickets, queryFor} = AgentGuardDemo;
const selector = document.getElementById('scenario-select');
Object.entries(AgentGuardDemo.scenarios).forEach(([id, value]) => { const option = document.createElement('option'); option.value=id; option.textContent=id.toUpperCase()+': '+value.name; option.selected=id===scenario; selector.append(option); });
selector.addEventListener('change',()=>{location.href='index.html?scenario='+selector.value;});
const results = document.getElementById('results');
const order = scenario === 's4' ? ['t3','t1','t2'] : ['t1','t2','t3'];
if (scenario === 's4') results.insertAdjacentHTML('beforeend','<p class="hint">Best value is highlighted below. Check the journey date before selecting.</p>');
order.forEach(id => { const t=tickets[id], promoted=scenario==='s4'&&id==='t3'; results.insertAdjacentHTML('beforeend', `<article class="card"><div class="row"><div><strong>${t.name}</strong>${promoted ? '<span class="badge">Best value, recommended</span>' : ''}<br><span class="muted">${t.route} · ${t.date}</span></div><div><strong>Rs ${t.price.toLocaleString('en-IN')}</strong><br><a class="button" href="checkout.html?${queryFor(id)}">Select</a></div></div></article>`); });
</script></body></html>
