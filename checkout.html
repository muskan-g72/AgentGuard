<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Checkout · AgentGuard Demo</title>
  <link rel="stylesheet" href="styles.css"><script src="app.js"></script>
</head>
<body><main>
  <header><a href="ui/" class="muted">← AgentGuard control room</a><h1>Review your booking</h1>
    <p class="muted">Simulated checkout. No payment is taken.</p><p>Cart ID: <span id="cart-id"></span></p></header>
  <section class="card" id="cart" aria-label="Cart items"></section>
  <section class="card" id="requirements" aria-label="Ticket requirements"></section>
  <div id="total-wrap" class="card total">Total: <span id="total" data-total="0"></span></div>
  <p id="passengers" class="muted">Passengers: 1</p>
  <p id="order-error" class="error" role="alert" hidden></p>
  <button id="confirm" type="button">Place Order</button>
</main><script src="checkout.js"></script></body>
</html>
